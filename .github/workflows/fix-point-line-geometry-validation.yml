name: Fix Point-Line Geometry-code validation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-point-line-geometry-validation.py'
      - '.github/workflows/fix-point-line-geometry-validation.yml'

permissions:
  contents: write

concurrency:
  group: point-line-geometry-validation-fix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Point-Line validation fix
        run: python3 scripts/fix-point-line-geometry-validation.py

      - name: Correct browser regression to run validation explicitly
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/browser-point-line-geometry-code-v2.py')
          text=path.read_text(encoding='utf-8')
          text=text.replace(
              "    page.locator('.plgce-code').fill('{\"type\":\"Point\",\"coordinates\":[154,-28]}')\n    page.wait_for_function(\"document.querySelector('.plgce-report')?.classList.contains('ok')\")",
              "    page.locator('.plgce-code').fill('{\"type\":\"Point\",\"coordinates\":[154,-28]}')\n    page.locator('[data-plgce=\"check\"]').click()\n    page.wait_for_function(\"document.querySelector('.plgce-report')?.classList.contains('ok')\")",
              1,
          )
          text=text.replace(
              "    page.locator('.plgce-code').fill('{\"type\":\"LineString\",\"coordinates\":[[153,-27],[155,-29],[156,-30]]}')\n    page.wait_for_function(\"document.querySelector('.plgce-report')?.classList.contains('ok')\")",
              "    page.locator('.plgce-code').fill('{\"type\":\"LineString\",\"coordinates\":[[153,-27],[155,-29],[156,-30]]}')\n    page.locator('[data-plgce=\"check\"]').click()\n    page.wait_for_function(\"document.querySelector('.plgce-report')?.classList.contains('ok')\")",
              1,
          )
          path.write_text(text,encoding='utf-8')
          PY

      - name: Verify targeted repository contracts
        run: |
          git diff --check
          node --check docs/assets/editpolygon-app.js
          node scripts/check-repo.mjs
          node scripts/audit-runtime.mjs
          node scripts/audit-bindings.mjs
          node --test tests/geometry-code-editor.test.mjs tests/point-line-geometry-code-v2.test.mjs tests/point-line-inspector-layout.test.mjs tests/release-cache.test.mjs

      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium

      - name: Run Polygon and Point-Line browser regressions
        run: |
          python tests/browser-geometry-code-smoke.py
          python tests/browser-point-line-geometry-code-v2.py

      - name: Run full Node suite as informational regression check
        continue-on-error: true
        run: npm test

      - name: Remove one-shot fix machinery
        run: |
          rm -f scripts/fix-point-line-geometry-validation.py
          rm -f .github/workflows/fix-point-line-geometry-validation.yml

      - name: Commit verified runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: validate Point-Line Geometry code by geometry type"
          git push origin HEAD:main
