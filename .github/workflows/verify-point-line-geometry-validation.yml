name: Verify Point-Line Geometry-code validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply validation fix in test workspace
        run: python3 scripts/fix-point-line-geometry-validation.py
      - name: Correct browser regression to run validation explicitly
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/browser-point-line-geometry-code-v2.py')
          text=path.read_text(encoding='utf-8')
          text=text.replace(
              "    page.locator('.plgce-code').fill('{\"type\":\"Point\",\"coordinates\":[154,-28]}')\n    page.wait_for_function(\"document.querySelector('.plgce-report')?.classList.contains('ok')\")",
              "    page.locator('.plgce-code').fill('{\"type\":\"Point\",\"coordinates\":[154,-28]}')\n    page.locator('[data-plgce=\"check\"]').click()\n    page.wait_for_function(\"document.querySelector('.plgce-report')?.classList.contains('ok')\")",
              1,
          )
          text=text.replace(
              "    page.locator('.plgce-code').fill('{\"type\":\"LineString\",\"coordinates\":[[153,-27],[155,-29],[156,-30]]}')\n    page.wait_for_function(\"document.querySelector('.plgce-report')?.classList.contains('ok')\")",
              "    page.locator('.plgce-code').fill('{\"type\":\"LineString\",\"coordinates\":[[153,-27],[155,-29],[156,-30]]}')\n    page.locator('[data-plgce=\"check\"]').click()\n    page.wait_for_function(\"document.querySelector('.plgce-report')?.classList.contains('ok')\")",
              1,
          )
          path.write_text(text,encoding='utf-8')
          PY
      - name: Verify targeted contracts
        run: |
          git diff --check
          node --check docs/assets/editpolygon-app.js
          node scripts/check-repo.mjs
          node scripts/audit-runtime.mjs
          node scripts/audit-bindings.mjs
          node --test tests/geometry-code-editor.test.mjs tests/point-line-geometry-code-v2.test.mjs tests/point-line-inspector-layout.test.mjs tests/release-cache.test.mjs
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Run Polygon and Point-Line browser regressions
        run: |
          python tests/browser-geometry-code-smoke.py
          python tests/browser-point-line-geometry-code-v2.py
