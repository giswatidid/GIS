name: EditPolygon quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply staged Snap preview metric fix
        if: github.event_name == 'pull_request'
        run: python scripts/apply-snap-preview-metrics-fix.py

      - name: Diagnose staged Snap metrics
        if: github.event_name == 'pull_request'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          let uiSource=fs.readFileSync('docs/assets/gis-processing.js','utf8');
          uiSource=uiSource.replace('global.__editPolygonGISProcessingPreview=Object.freeze({','global.__snapMetricDebug={geometryVertexSequences,snapSequenceAlignment,snapComparison};\nglobal.__editPolygonGISProcessingPreview=Object.freeze({');
          const window={};
          const context=vm.createContext({window,globalThis:window,Object,Map,Set,JSON,String,Array,Number,Math,Date,URL,Error,Promise,Uint8Array,Float64Array});
          vm.runInContext(uiSource,context);
          const task=vm.runInContext(`({toolId:'snap',inputs:{source:[{id:'a',geometry:{type:'LineString',coordinates:[[0,0],[1,0],[2,0]]}}]},parameters:{tolerance:20000}})`,context);
          const output=vm.runInContext(`[{id:'a',geometry:{type:'LineString',coordinates:[[0,0],[0.5,0],[1.1,0],[2,0]]}}]`,context);
          const sourceSeq=window.__snapMetricDebug.geometryVertexSequences(task.inputs.source[0].geometry,[]);
          const outputSeq=window.__snapMetricDebug.geometryVertexSequences(output[0].geometry,[]);
          console.log('SNAP_SEQUENCES_DIAGNOSTIC',JSON.stringify({sourceSeq,outputSeq}));
          console.log('SNAP_ALIGNMENT_DIAGNOSTIC',JSON.stringify(window.__snapMetricDebug.snapSequenceAlignment(sourceSeq[0]||[],outputSeq[0]||[],20000)));
          console.log('SNAP_COMPARISON_DIAGNOSTIC',JSON.stringify(window.__snapMetricDebug.snapComparison(task.inputs.source,output,20000)));
          console.log('SNAP_METRICS_DIAGNOSTIC',JSON.stringify(window.__editPolygonGISProcessingPreview.comparisonMetrics(task,{kind:'layer'},output)));
          NODE

      - name: Install browser-test runtime
        run: python -m pip install --disable-pip-version-check playwright

      - name: Run repository audits and Node tests
        run: npm run check

      - name: Run full browser smoke suite
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run test:browser-smoke

      - name: Commit verified Snap metric fix
        if: github.event_name == 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs tests scripts/audit-runtime.mjs RELEASE_MANIFEST.md ARCHITECTURE.md package.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'fix: align Snap preview vertex metrics'
            git push origin HEAD:${{ github.head_ref }}
          fi
