name: EditPolygon quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply staged local-import and CSV integration
        if: github.event_name == 'pull_request'
        run: |
          python scripts/prepare-local-import-csv-fix.py
          python scripts/apply-local-import-csv-fix.py

      - name: Check changed JavaScript syntax
        run: |
          node --check docs/assets/gis-file-import.js
          node --check docs/assets/gis-data-tools.js
          node --check docs/assets/editpolygon-app.js

      - name: Install browser-test runtime
        run: python -m pip install --disable-pip-version-check playwright

      - name: Run repository audits and Node tests
        run: npm run check

      - name: Run full browser smoke suite
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run test:browser-smoke

      - name: Commit verified integration
        if: github.event_name == 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs tests package.json ARCHITECTURE.md RELEASE_MANIFEST.md README.md scripts/audit-runtime.mjs scripts/audit-bindings.mjs
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'feat: support GeoPackage FileGDB and plain CSV export'
            git push origin HEAD:${{ github.head_ref }}
          fi
