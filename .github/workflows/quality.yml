name: EditPolygon preview completion verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: feat/processing-preview-v156
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser-test runtime
        run: python -m pip install --disable-pip-version-check playwright

      - name: Apply preview completion patches
        run: |
          python -m py_compile scripts/complete-processing-preview-v2.py scripts/complete-processing-preview-v2-compat.py scripts/complete-processing-preview-v3.py
          rm -rf scripts/__pycache__ tests/__pycache__
          python scripts/complete-processing-preview-v2.py
          python scripts/complete-processing-preview-v2-compat.py
          rm -rf scripts/__pycache__ tests/__pycache__

      - name: Verify patched JavaScript and diff
        run: |
          git diff --check
          node --check docs/assets/gis-processing-registry.js
          node --check docs/assets/gis-processing-core.js
          node --check docs/assets/gis-processing.js
          node --check docs/assets/gis-processing-worker.js
          node --check docs/assets/editpolygon-app.js

      - name: Run repository audits and Node tests
        id: nodecheck
        shell: bash
        run: |
          set +e
          npm run check 2>&1 | tee /tmp/npm-check.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish failed quality-gate diagnostic
        if: steps.nodecheck.outputs.code != '0'
        shell: bash
        run: |
          cp /tmp/npm-check.log PROCESSING_PREVIEW_CHECK_DIAGNOSTIC.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f PROCESSING_PREVIEW_CHECK_DIAGNOSTIC.txt
          git commit -m "diagnostic: capture Processing preview quality failure"
          git push --force origin HEAD:refs/heads/verify/processing-preview-check-diagnostic
          exit 1

      - name: Run full browser smoke suite
        if: steps.nodecheck.outputs.code == '0'
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run test:browser-smoke
