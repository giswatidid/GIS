name: EditPolygon quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply staged Snap preview metric fix
        if: github.event_name == 'pull_request'
        run: python scripts/apply-snap-preview-metrics-fix.py

      - name: Diagnose staged Snap metrics
        if: github.event_name == 'pull_request'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const uiSource=fs.readFileSync('docs/assets/gis-processing.js','utf8');
          const window={};
          const context=vm.createContext({window,globalThis:window,Object,Map,Set,JSON,String,Array,Number,Math,Date,URL,Error,Promise,Uint8Array,Float64Array});
          vm.runInContext(uiSource,context);
          const metrics=JSON.parse(vm.runInContext(`JSON.stringify(window.__editPolygonGISProcessingPreview.comparisonMetrics(
            {toolId:'snap',inputs:{source:[{id:'a',geometry:{type:'LineString',coordinates:[[0,0],[1,0],[2,0]]}}]},parameters:{tolerance:20000}},
            {kind:'layer'},
            [{id:'a',geometry:{type:'LineString',coordinates:[[0,0],[0.5,0],[1.1,0],[2,0]]}}]
          ))`,context));
          console.log('SNAP_METRICS_DIAGNOSTIC',JSON.stringify(metrics));
          if(metrics.verticesInserted!==1||metrics.verticesMoved!==1||metrics.maxDisplacementM<=10000||metrics.maxDisplacementM>=12000||metrics.maxDisplacementM>20000)process.exit(1);
          NODE

      - name: Install browser-test runtime
        run: python -m pip install --disable-pip-version-check playwright

      - name: Run repository audits and Node tests
        run: npm run check

      - name: Run full browser smoke suite
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run test:browser-smoke

      - name: Commit verified Snap metric fix
        if: github.event_name == 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs tests scripts/audit-runtime.mjs RELEASE_MANIFEST.md ARCHITECTURE.md package.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'fix: align Snap preview vertex metrics'
            git push origin HEAD:${{ github.head_ref }}
          fi
