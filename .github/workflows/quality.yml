name: EditPolygon quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: feat/processing-preview-v156
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser-test runtime
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Apply, assert and verify completed Processing preview
        shell: bash
        run: |
          set +e
          LOG=/tmp/processing-preview-v2.log
          : > "$LOG"
          {
            echo '=== patch syntax ==='
            python -m py_compile scripts/complete-processing-preview-v2.py scripts/complete-processing-preview-v2-compat.py
            echo '=== apply readable completion patch ==='
            python scripts/complete-processing-preview-v2.py
            python scripts/complete-processing-preview-v2-compat.py
            echo '=== required architecture in working tree ==='
            grep -q 'previewPolicy' docs/assets/gis-processing-registry.js
            grep -q 'previewFingerprint' docs/assets/gis-processing-core.js
            grep -q 'commitPreparedProcessingResult' docs/assets/editpolygon-app.js
            grep -q 'scheduleAutoPreview' docs/assets/gis-processing.js
            echo '=== syntax and diff checks ==='
            git diff --check
            node --check docs/assets/gis-processing.js
            node --check docs/assets/gis-processing-registry.js
            node --check docs/assets/gis-processing-core.js
            node --check docs/assets/editpolygon-app.js
            python -m py_compile tests/browser-processing-preview-smoke.py tests/browser-processing-preview-reuse-smoke.py
            echo '=== repository audits + node tests ==='
            npm run check
            echo '=== full browser smoke suite ==='
            npm run test:browser-smoke
          } >"$LOG" 2>&1
          STATUS=$?

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          restore_quality() {
            cat > .github/workflows/quality.yml <<'YAML'
          name: EditPolygon quality

          on:
            pull_request:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            quality:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Set up Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: '22'

                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'

                - name: Install browser-test runtime
                  run: |
                    python -m pip install --upgrade pip
                    python -m pip install playwright
                    python -m playwright install --with-deps chromium

                - name: Run repository and Node quality gate
                  run: npm run check

                - name: Run browser smoke suite
                  run: npm run test:browser-smoke
          YAML
          }

          if [ "$STATUS" -ne 0 ]; then
            git reset --hard HEAD
            restore_quality
            rm -f scripts/complete-processing-preview-v2.py scripts/complete-processing-preview-v2-compat.py
            rm -f .github/workflows/complete-processing-preview.yml
            cp "$LOG" PREVIEW_VERIFIER_FAILURE.txt
            git add -A
            git commit -m "test: record Processing preview completion failure"
            git push origin HEAD:feat/processing-preview-v156
            cat "$LOG"
            exit "$STATUS"
          fi

          restore_quality
          rm -f PREVIEW_VERIFIER_FAILURE.txt
          rm -f scripts/complete-processing-preview-v2.py scripts/complete-processing-preview-v2-compat.py
          rm -f .github/workflows/complete-processing-preview.yml
          git add -A
          git commit -m "feat: complete Processing preview workflow"
          git push origin HEAD:feat/processing-preview-v156
          cat "$LOG"
