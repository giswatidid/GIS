name: EditPolygon quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser-test runtime
        run: python -m pip install --disable-pip-version-check playwright

      - name: Run repository audits and Node tests
        run: npm run check

      - name: Run full browser smoke suite
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run test:browser-smoke
