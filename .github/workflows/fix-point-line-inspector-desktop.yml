name: Fix Point-Line desktop Inspector

on:
  push:
    branches:
      - fix/point-line-inspector-desktop
    paths:
      - 'scripts/fix-point-line-inspector-desktop.py'
      - '.github/workflows/fix-point-line-inspector-desktop.yml'

permissions:
  contents: write

concurrency:
  group: point-line-inspector-desktop-fix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply targeted desktop Inspector fix
        run: python3 scripts/fix-point-line-inspector-desktop.py

      - name: Verify JavaScript and repository contracts
        run: |
          git diff --check
          node --check docs/assets/editpolygon-app.js
          node scripts/check-repo.mjs
          node scripts/audit-runtime.mjs
          node scripts/audit-bindings.mjs
          npm test

      - name: Install browser regression dependency
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium

      - name: Run Geometry code browser regressions
        run: |
          python tests/browser-geometry-code-smoke.py
          python tests/browser-point-line-geometry-code-v2.py

      - name: Remove one-shot fix machinery
        run: |
          rm -f scripts/fix-point-line-inspector-desktop.py
          rm -f .github/workflows/fix-point-line-inspector-desktop.yml

      - name: Commit verified runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilise Point-Line Geometry code desktop Inspector"
          git push origin HEAD:fix/point-line-inspector-desktop
