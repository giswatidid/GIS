name: Verify Processing map preview mode

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/processing-preview-v156'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: feat/processing-preview-v156
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser-test runtime
        run: python -m pip install --disable-pip-version-check playwright

      - name: Apply map preview mode patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/apply-processing-preview-map-mode.py')
          text=path.read_text(encoding='utf-8')
          old="""pkg=PKG.read_text(encoding='utf-8')
          pkg=replace_once(pkg,
          'python tests/browser-processing-preview-interactive-smoke.py',
          'python tests/browser-processing-preview-interactive-smoke.py && python tests/browser-processing-preview-map-mode-smoke.py',
          'browser smoke package chain')
          PKG.write_text(pkg,encoding='utf-8')"""
          new="""pkg=PKG.read_text(encoding='utf-8')
          needle='python tests/browser-processing-preview-interactive-smoke.py'
          if pkg.count(needle)!=2:raise SystemExit(f'browser smoke package chain: expected two matches, found {pkg.count(needle)}')
          pkg=pkg.replace(needle,needle+' && python tests/browser-processing-preview-map-mode-smoke.py')
          PKG.write_text(pkg,encoding='utf-8')"""
          if old not in text:raise SystemExit('package matcher patch anchor missing')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile scripts/apply-processing-preview-map-mode.py
          rm -rf scripts/__pycache__ tests/__pycache__
          python scripts/apply-processing-preview-map-mode.py
          python - <<'PY'
          from pathlib import Path
          audit=Path('scripts/audit-runtime.mjs')
          text=audit.read_text(encoding='utf-8')
          old='20260820-v1561-processing-preview-v6'
          new='20260820-v1561-processing-preview-v7'
          if text.count(old)!=1:raise SystemExit(f'runtime audit cache key: expected one v6 key, found {text.count(old)}')
          audit.write_text(text.replace(old,new),encoding='utf-8')

          smoke=Path('tests/browser-processing-preview-map-mode-smoke.py')
          text=smoke.read_text(encoding='utf-8')
          old_call="EditPolygonGISProcessingUI.mount(document.getElementById('host'),{layerId:'source',toolId:'simplify',api:EditPolygonGIS})"
          new_call="window.EditPolygonGISProcessingUI.mount(document.getElementById('host'),{layerId:'source',toolId:'simplify',api:window.EditPolygonGIS})"
          if text.count(old_call)!=1:raise SystemExit(f'map preview fixture global anchor: expected one match, found {text.count(old_call)}')
          text=text.replace(old_call,new_call)
          anchor="    page.add_style_tag(path=str(CSS));page.add_script_tag(path=str(JS));"
          setup='''    page.evaluate("""() => {\n      const tool={id:'simplify',title:'Simplify',category:'maintenance',description:'Reduce vertices',resultKind:'layer',mutationPolicy:'new-or-modify',previewPolicy:{enabled:true,kind:'geometry',mode:'live',debounceMs:80,maxAutoFeatures:1000,metrics:[]},inputs:[{id:'source',label:'Input layer',families:['line'],scopes:['all']}],parameters:[{id:'tolerance',label:'Tolerance (metres)',type:'number',default:1000,required:true,min:0,nonZero:true,slider:{scale:'log',min:1,max:100000,labels:['1 m','10 m','100 m','1 km','10 km','100 km']}}]};\n      const layer={id:'source',name:'Source',features:[{id:'a',geometryType:'LineString',properties:{name:'A'},filtered:false}]};\n      const normaliseRequest=v=>({toolId:'simplify',inputs:{source:{layerId:'source',scope:'all'}},parameters:{tolerance:v?.parameters?.tolerance??1000},output:{mode:v?.output?.mode||'new-layer',name:v?.output?.name||'Result'}});\n      const preflight=v=>{const request=normaliseRequest(v);return{valid:true,errors:[],warnings:[],request,tool,inputs:{source:layer},inputFeatures:{source:layer.features},counts:{source:1},source:layer};};\n      window.EditPolygonGISProcessingRegistry={getTool:id=>id==='simplify'?tool:null,search:()=>[tool],getCategories:()=>[{id:'maintenance',title:'Geometry maintenance'}],getCategory:()=>({title:'Geometry maintenance'})};\n      window.EditPolygonGISProcessingCore={family:()=> 'line',normaliseRequest,defaultOutputName:()=> 'Result',preflight,resolveProcessingCrs:()=> 'EPSG:32756',previewFingerprint:()=> 'fp'};\n      window.compactProjectState=()=>({files:[{id:'source',name:'Source',features:[{id:'a',name:'A',properties:{name:'A'},geometry:{type:'LineString',coordinates:[[153,-27],[153.2,-27.1],[153.4,-27]]}}]}]});\n      window.Worker=undefined;window.turf={length:()=>10,bbox:()=>[153,-27.1,153.4,-27]};\n      window.EditPolygonGISProcessingEngine={execute:async(task,{onProgress})=>{onProgress({stage:'Simplifying',done:1,total:1,percent:80});return{kind:'layer',features:[{type:'Feature',id:'a',properties:{name:'A'},geometry:{type:'LineString',coordinates:[[153,-27],[153.4,-27]]}}],summary:{input:1,processed:1,output:1,failed:0},failures:[],processingCrs:'EPSG:32756'};}};\n      window.__setCalls=0;window.__addCalls=0;window.__restore=null;window.__overlay=null;\n      window.EditPolygonMap={createVectorOverlayLayer:()=>window.__overlay={present:true,items:[]},clearVectorOverlayLayer:o=>{o.items=[];return true},setVectorOverlayFeatures:(o,items)=>{o.items=items;window.__setCalls++;return true},hasDisplayLayer:o=>!!o.present,addDisplayLayer:o=>{o.present=true;window.__addCalls++;return o},on:(types,handler)=>{window.__restore=handler;return()=>{window.__restore=null}},resize:()=>true};\n      window.EditPolygonGIS={getEditableLayers:()=>[layer],getSelection:()=>({ids:[]}),previewProcessingRequest:preflight,runProcessingRequest:async()=>({kind:'layer',output:{id:'o',name:'Result'},summary:{input:1,processed:1,output:1,failed:0},failures:[]}),cancelProcessing:()=>true};\n    }""")\n'''
          if text.count(anchor)!=1:raise SystemExit(f'map preview fixture setup anchor: expected one match, found {text.count(anchor)}')
          smoke.write_text(text.replace(anchor,setup+anchor),encoding='utf-8')
          PY
          git rm -f scripts/apply-processing-preview-map-mode.py .github/workflows/preview-map-mode-verify.yml
          rm -rf scripts/__pycache__ tests/__pycache__
          git diff --check
          node --check docs/assets/gis-processing.js

      - name: Run repository audits and Node tests
        run: npm run check

      - name: Run full browser smoke suite
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run test:browser-smoke

      - name: Publish verified candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add map-first Processing preview mode"
          git push --force origin HEAD:refs/heads/verify/processing-preview-map-mode
