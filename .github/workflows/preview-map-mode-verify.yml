name: Verify Processing map preview mode

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/processing-preview-v156'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: feat/processing-preview-v156
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser-test runtime
        run: python -m pip install --disable-pip-version-check playwright

      - name: Apply map preview mode patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/apply-processing-preview-map-mode.py')
          text=path.read_text(encoding='utf-8')
          old="""pkg=PKG.read_text(encoding='utf-8')
          pkg=replace_once(pkg,
          'python tests/browser-processing-preview-interactive-smoke.py',
          'python tests/browser-processing-preview-interactive-smoke.py && python tests/browser-processing-preview-map-mode-smoke.py',
          'browser smoke package chain')
          PKG.write_text(pkg,encoding='utf-8')"""
          new="""pkg=PKG.read_text(encoding='utf-8')
          needle='python tests/browser-processing-preview-interactive-smoke.py'
          if pkg.count(needle)!=2:raise SystemExit(f'browser smoke package chain: expected two matches, found {pkg.count(needle)}')
          pkg=pkg.replace(needle,needle+' && python tests/browser-processing-preview-map-mode-smoke.py')
          PKG.write_text(pkg,encoding='utf-8')"""
          if old not in text:raise SystemExit('package matcher patch anchor missing')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile scripts/apply-processing-preview-map-mode.py
          rm -rf scripts/__pycache__ tests/__pycache__
          python scripts/apply-processing-preview-map-mode.py
          python - <<'PY'
          from pathlib import Path
          audit=Path('scripts/audit-runtime.mjs')
          text=audit.read_text(encoding='utf-8')
          old='20260820-v1561-processing-preview-v6'
          new='20260820-v1561-processing-preview-v7'
          if text.count(old)!=1:raise SystemExit(f'runtime audit cache key: expected one v6 key, found {text.count(old)}')
          audit.write_text(text.replace(old,new),encoding='utf-8')

          smoke=Path('tests/browser-processing-preview-map-mode-smoke.py')
          text=smoke.read_text(encoding='utf-8')
          old_call="EditPolygonGISProcessingUI.mount(document.getElementById('host'),{layerId:'source',toolId:'simplify',api:EditPolygonGIS})"
          new_call="window.EditPolygonGISProcessingUI.mount(document.getElementById('host'),{layerId:'source',toolId:'simplify',api:window.EditPolygonGIS})"
          if text.count(old_call)!=1:raise SystemExit(f'map preview fixture global anchor: expected one match, found {text.count(old_call)}')
          smoke.write_text(text.replace(old_call,new_call),encoding='utf-8')
          PY
          git rm -f scripts/apply-processing-preview-map-mode.py .github/workflows/preview-map-mode-verify.yml
          rm -rf scripts/__pycache__ tests/__pycache__
          git diff --check
          node --check docs/assets/gis-processing.js

      - name: Run repository audits and Node tests
        run: npm run check

      - name: Run full browser smoke suite
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run test:browser-smoke

      - name: Publish verified candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add map-first Processing preview mode"
          git push --force origin HEAD:refs/heads/verify/processing-preview-map-mode
