name: Apply final geometry-code Inspector fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-geometry-code-inspector-final.yml'
      - 'scripts/apply-geometry-code-inspector-final.py'

permissions:
  contents: write

concurrency:
  group: geometry-code-inspector-final
  cancel-in-progress: false

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply final Inspector integration
        run: python3 scripts/apply-geometry-code-inspector-final.py

      - name: Verify repository
        run: |
          git diff --check
          node --check docs/assets/editpolygon-app.js
          npm run check

      - name: Commit corrected runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finish geometry-code Inspector integration"
          git push origin HEAD:main
