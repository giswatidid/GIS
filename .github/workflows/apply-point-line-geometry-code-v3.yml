name: Apply Point-Line Geometry code v3 hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-point-line-geometry-code-v3.yml'

permissions:
  contents: write

concurrency:
  group: point-line-geometry-code-v3-hotfix
  cancel-in-progress: false

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply targeted Point-Line hotfix
        run: python3 scripts/apply-point-line-geometry-code-v3.py

      - name: Verify JavaScript and repository contracts
        run: |
          git diff --check
          node --check docs/assets/editpolygon-app.js
          node scripts/check-repo.mjs
          node scripts/audit-runtime.mjs
          node scripts/audit-bindings.mjs
          node --test tests/geometry-code-editor.test.mjs tests/point-line-geometry-code-v2.test.mjs tests/release-cache.test.mjs

      - name: Install browser regression dependency
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium

      - name: Run Polygon and Point-Line browser regressions
        run: |
          python tests/browser-geometry-code-smoke.py
          python tests/browser-point-line-geometry-code-v2.py

      - name: Run full Node suite
        run: npm test

      - name: Remove one-shot hotfix machinery
        run: |
          rm -f scripts/apply-point-line-geometry-code-v3.py
          rm -f .github/workflows/apply-point-line-geometry-code-v3.yml

      - name: Commit verified runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make Point-Line Geometry code work in live Inspector"
          git push origin HEAD:main
