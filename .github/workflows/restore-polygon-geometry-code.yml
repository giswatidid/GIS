name: Restore polygon Geometry code baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-polygon-geometry-code.yml'
      - 'scripts/restore-polygon-geometry-code.py'

permissions:
  contents: write

concurrency:
  group: restore-polygon-geometry-code
  cancel-in-progress: false

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore known-good polygon Geometry code
        run: python scripts/restore-polygon-geometry-code.py

      - name: Verify source and architecture
        run: |
          git diff --check
          node --check docs/assets/editpolygon-app.js
          node scripts/check-repo.mjs
          node scripts/audit-runtime.mjs
          node scripts/audit-bindings.mjs
          node --test tests/geometry-code-editor.test.mjs tests/release-cache.test.mjs

      - name: Install Playwright browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Verify polygon Geometry code interaction in Chromium
        run: python tests/browser-geometry-code-smoke.py

      - name: Commit restored baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore working polygon Geometry code baseline"
          git push origin HEAD:main
