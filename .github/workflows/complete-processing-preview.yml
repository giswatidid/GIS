name: Complete Processing preview

# One-shot verifier for finishing PR #4. Removed automatically after success.
on:
  push:
    branches: [feat/processing-preview-v156]
    paths:
      - 'scripts/.processing-preview-patch.part*'
      - '.github/workflows/complete-processing-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: complete-processing-preview-v156
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: feat/processing-preview-v156
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser-test runtime
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Apply and verify, or publish diagnostic
        shell: bash
        run: |
          set +e
          LOG=/tmp/processing-preview-verifier.log
          : > "$LOG"
          {
            echo '=== reconstruct patch ==='
            cat scripts/.processing-preview-patch.part* > scripts/complete-processing-preview.py
            python -m py_compile scripts/complete-processing-preview.py
            python scripts/complete-processing-preview.py
            echo '=== syntax and diff checks ==='
            git diff --check
            node --check docs/assets/gis-processing.js
            node --check docs/assets/gis-processing-registry.js
            node --check docs/assets/gis-processing-core.js
            node --check docs/assets/editpolygon-app.js
            python -m py_compile tests/browser-processing-preview-smoke.py
            echo '=== repository + node gate ==='
            npm run check
            echo '=== full browser smoke gate ==='
            npm run test:browser-smoke
          } >"$LOG" 2>&1
          STATUS=$?
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$STATUS" -ne 0 ]; then
            git reset --hard HEAD
            cp "$LOG" PREVIEW_VERIFIER_FAILURE.txt
            git add PREVIEW_VERIFIER_FAILURE.txt
            git commit -m "test: record Processing preview verifier failure"
            git push origin HEAD:feat/processing-preview-v156
            cat "$LOG"
            exit "$STATUS"
          fi
          rm -f PREVIEW_VERIFIER_FAILURE.txt
          rm -f scripts/.processing-preview-patch.part*
          rm -f scripts/complete-processing-preview.py
          rm -f .github/workflows/complete-processing-preview.yml
          git add -A
          git commit -m "feat: complete Processing preview workflow"
          git push origin HEAD:feat/processing-preview-v156
          cat "$LOG"
